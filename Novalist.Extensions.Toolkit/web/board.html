<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Toolkit</title>
<style>
/* The host injects no variables into an extension frame, so the palette lives
   here. Matched to the app's dark theme, which is what this sits inside. */
:root {
  --bg: #1e1e1e; --card: #252526; --border: #3a3a3d; --text: #e6edf3;
  --dim: #b9bac5; --subtle: #8b9198; --accent: #0e8bdf; --open: #d8a13a;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  display: flex; flex-direction: column;
  font: 13px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
  background: var(--bg); color: var(--text);
}

#tabs { display: flex; gap: 4px; padding: 10px 12px 0; }
.panel { flex: 1; overflow-y: auto; padding: 16px 12px; }
.panel.hidden { display: none; }

/* Everything inside a panel is centred in a readable column. Without this the
   sprint controls spread across the full width of the window and the clock
   ends up marooned in the middle of nothing. */
.column { max-width: 620px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

button {
  font: inherit; padding: 6px 12px; border-radius: 8px; cursor: pointer;
  background: var(--card); color: var(--dim); border: 1px solid var(--border);
}
button:hover { color: var(--text); border-color: var(--subtle); }
button.tab.active { color: #fff; background: var(--accent); border-color: var(--accent); }
button.primary { color: #fff; background: var(--accent); border-color: var(--accent); }
button:disabled { opacity: .5; cursor: default; }

/* The clock is what you look at from across a desk, so it is the size of that. */
.clock {
  font-size: 60px; font-weight: 300; line-height: 1;
  font-variant-numeric: tabular-nums; letter-spacing: -.02em; text-align: center;
  margin-top: 8px;
}
.clock.resting { color: var(--subtle); }
.phase { text-align: center; color: var(--dim); }

.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: center; }
label { display: flex; gap: 5px; align-items: center; color: var(--dim); }

input[type="number"] {
  width: 4.5em; font: inherit; padding: 5px 6px; border-radius: 8px;
  background: var(--card); color: var(--text); border: 1px solid var(--border);
}

.stats { display: flex; gap: 22px; flex-wrap: wrap; justify-content: center; }
.stat { display: flex; flex-direction: column; align-items: center; }
.stat b { font-size: 20px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 11px; color: var(--subtle); text-transform: uppercase; letter-spacing: .05em; }

h3 { font-size: 13px; margin: 8px 0 0; color: var(--dim); }

table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--border); }
th { font-weight: 600; color: var(--dim); }
td.num { text-align: right; font-variant-numeric: tabular-nums; }

ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
li.task {
  display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border-radius: 8px;
  background: var(--card); border: 1px solid var(--border); border-left: 3px solid var(--open);
}
li.task.done { opacity: .5; border-left-color: var(--border); }
.task-body { flex: 1; min-width: 0; }
.task-anchor { color: var(--dim); font-style: italic; }
.task-where { font-size: 11px; color: var(--subtle); }

.hint { color: var(--dim); margin: 0; }
.empty { padding: 28px 0; text-align: center; color: var(--subtle); }
</style>
</head>
<body>
<div id="tabs">
  <button class="tab active" data-panel="sprint" data-t="tabSprint"></button>
  <button class="tab" data-panel="tasks" data-t="tabTasks"></button>
</div>

<section id="sprint" class="panel">
  <div class="column">
    <div class="clock" id="clock">--:--</div>
    <div class="phase" id="phase"></div>
    <div class="row">
      <button class="primary" id="startStop"></button>
      <label><span data-t="write"></span>
        <input type="number" id="writing" min="1" max="180" value="25">
        <span data-t="minutes"></span></label>
      <label><span data-t="rest"></span>
        <input type="number" id="resting" min="1" max="60" value="5">
        <span data-t="minutes"></span></label>
    </div>
    <div class="stats" id="stats"></div>
    <h3 data-t="finished"></h3>
    <div id="history"></div>
  </div>
</section>

<section id="tasks" class="panel hidden">
  <div class="column">
    <div class="row" style="justify-content:flex-start">
      <label><input type="checkbox" id="showDone"> <span data-t="showDone"></span></label>
      <span class="hint" id="taskCount"></span>
    </div>
    <div id="taskList"></div>
  </div>
</section>

<script>
// The host relays a controller's reply back with nothing tying it to the
// request, so replies are routed on the kind they say they answer.
function post(msg) {
  parent.postMessage({ novalistExt: JSON.stringify(msg) }, '*');
}

const escape = (s) => String(s ?? '').replace(/[&<>"]/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// Every label comes from the host, so this page holds no English of its own.
let S = {};
const t = (key, ...args) => {
  let text = S[key] || '';
  args.forEach((a, i) => { text = text.replace('{' + i + '}', String(a)); });
  return text;
};

const clock = document.getElementById('clock');
const phase = document.getElementById('phase');
const startStop = document.getElementById('startStop');
const writing = document.getElementById('writing');
const resting = document.getElementById('resting');
const taskList = document.getElementById('taskList');
const showDone = document.getElementById('showDone');

let running = false;
let tasks = [];

const stat = (value, label) =>
  '<div class="stat"><b>' + (value ?? 0) + '</b><span>' + escape(label) + '</span></div>';

function drawSprint(s) {
  if (s.error) { phase.textContent = s.error; return; }

  running = s.phase === 'Writing';
  const seconds = s.secondsLeft ?? 0;
  clock.textContent = String(Math.floor(seconds / 60)).padStart(2, '0') + ':' +
    String(seconds % 60).padStart(2, '0');
  clock.classList.toggle('resting', s.phase === 'Resting');

  phase.textContent =
    s.phase === 'Writing' ? t('progress', s.wordsSoFar, s.wordsPerMinute)
    : s.phase === 'Resting' ? t('resting')
    : t('notRunning');

  startStop.textContent = running ? t('stop') : t('start');
  // Only while nothing is running: overwriting the boxes as somebody types in
  // them is how a field fights the person filling it in.
  if (!running && document.activeElement !== writing) writing.value = s.writingMinutes;
  if (!running && document.activeElement !== resting) resting.value = s.restingMinutes;

  document.getElementById('stats').innerHTML =
    stat(s.completed, t('statSprints')) + stat(s.totalWords, t('statWords')) +
    stat(s.totalMinutes, t('statMinutes')) + stat(s.averageRate, t('statRate'));

  document.getElementById('history').innerHTML = (s.history && s.history.length)
    ? '<table><thead><tr><th>' + escape(t('colStarted')) + '</th><th class="num">' +
      escape(t('colMinutes')) + '</th><th class="num">' + escape(t('colWords')) +
      '</th><th class="num">' + escape(t('colRate')) + '</th></tr></thead><tbody>' +
      s.history.map((h) => {
        const when = new Date(h.startedAt);
        const rate = h.minutes > 0 ? Math.round(h.words / h.minutes) : 0;
        return '<tr><td>' + escape(isNaN(when.getTime()) ? h.startedAt : when.toLocaleString()) +
          '</td><td class="num">' + h.minutes + '</td><td class="num">' + h.words +
          '</td><td class="num">' + rate + '</td></tr>';
      }).join('') + '</tbody></table>'
    : '<p class="empty">' + escape(t('noSprints')) + '</p>';
}

function drawTasks(payload) {
  if (payload.error) {
    taskList.innerHTML = '<p class="empty">' + escape(payload.error) + '</p>';
    return;
  }
  tasks = payload.tasks || [];

  const shown = showDone.checked ? tasks : tasks.filter((t) => !t.done);
  const open = tasks.filter((t) => !t.done).length;
  document.getElementById('taskCount').textContent = t('openOf', open, tasks.length);

  if (!shown.length) {
    taskList.innerHTML = '<p class="empty">' +
      escape(tasks.length ? t('allDone') : t('noComments')) + '</p>';
    return;
  }

  // Named task rather than t, because t is the translator here and shadowing it
  // inside the loop is how a label silently becomes a task field.
  taskList.innerHTML = '<ul>' + shown.map((task, i) =>
    '<li class="task' + (task.done ? ' done' : '') + '">' +
      '<input type="checkbox" data-index="' + i + '"' + (task.done ? ' checked' : '') + '>' +
      '<div class="task-body">' +
        '<div>' + escape(task.text) + '</div>' +
        (task.anchor
          ? '<div class="task-anchor">' + escape(t('onPhrase', task.anchor)) + '</div>' : '') +
        '<div class="task-where">' + escape(task.chapterTitle + ' / ' + task.sceneTitle) +
          (task.author ? ' - ' + escape(task.author) : '') + '</div>' +
      '</div>' +
    '</li>').join('') + '</ul>';

  taskList.querySelectorAll('input[type="checkbox"]').forEach((box) => {
    box.onchange = () => {
      const task = shown[Number(box.dataset.index)];
      post({
        kind: box.checked ? 'taskDone' : 'taskReopen',
        chapterGuid: task.chapterGuid,
        sceneId: task.sceneId,
        commentId: task.commentId
      });
    };
  });
}

window.addEventListener('message', (event) => {
  const raw = event.data && event.data.novalistHost;
  if (typeof raw !== 'string') return;

  let msg;
  try {
    msg = JSON.parse(raw);
  } catch {
    return;
  }
  if (!msg) return;

  if (msg.kind === 'strings') {
    S = (msg.payload && msg.payload.strings) || {};
    document.querySelectorAll('[data-t]').forEach((el) => {
      el.textContent = t(el.dataset.t);
    });
    post({ kind: 'sprint' });
    return;
  }
  if (msg.kind === 'sprint') drawSprint(msg.payload || {});
  else if (msg.kind === 'tasks') drawTasks(msg.payload || {});
});

startStop.onclick = () => post({ kind: running ? 'sprintStop' : 'sprintStart' });

const pushSettings = () => post({
  kind: 'sprintSettings',
  writingMinutes: Number(writing.value) || 25,
  restingMinutes: Number(resting.value) || 5
});
writing.onchange = pushSettings;
resting.onchange = pushSettings;

showDone.onchange = () => drawTasks({ tasks });

document.querySelectorAll('.tab').forEach((tab) => {
  tab.onclick = () => {
    document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('active', t === tab));
    document.querySelectorAll('.panel').forEach((p) =>
      p.classList.toggle('hidden', p.id !== tab.dataset.panel));
    if (tab.dataset.panel === 'tasks') post({ kind: 'tasks' });
  };
});

// The clock has to move on its own, and only while the sprint panel is showing:
// there is nothing to watch on the other tab.
setInterval(() => {
  if (!document.getElementById('sprint').classList.contains('hidden')) post({ kind: 'sprint' });
}, 1000);

// Labels first: everything else waits on them.
post({ kind: 'strings' });
</script>
</body>
</html>

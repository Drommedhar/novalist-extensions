<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Insight</title>
<style>
/* The host injects no variables into an extension frame, so the palette is
   defined here. Taken from the app's dark theme, which is what these panels
   sit inside. */
:root {
  --bg: #1e1e1e; --card: #252526; --border: #3a3a3d; --text: #e6edf3;
  --dim: #b9bac5; --subtle: #8b9198; --accent: #0e8bdf;
  --problem: #e0575b; --warning: #d8a13a; --note: #58a0d8;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  display: flex; flex-direction: column;
  font: 13px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
  background: var(--bg); color: var(--text);
}

#tabs { display: flex; gap: 4px; flex-wrap: wrap; padding: 10px 12px 0; }
#toolbar {
  display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 12px 0;
}
#toolbar:empty { display: none; }
#body { flex: 1; overflow-y: auto; padding: 12px; }

button {
  font: inherit; padding: 6px 12px; border-radius: 8px; cursor: pointer;
  background: var(--card); color: var(--dim); border: 1px solid var(--border);
}
button:hover { color: var(--text); border-color: var(--subtle); }
button.tab.active { color: #fff; background: var(--accent); border-color: var(--accent); }
button:disabled { opacity: .5; cursor: default; }

input[type="text"] {
  flex: 1; min-width: 12em; font: inherit; padding: 6px 8px; border-radius: 8px;
  background: var(--card); color: var(--text); border: 1px solid var(--border);
}

h3 { font-size: 13px; margin: 20px 0 8px; color: var(--dim); }

ul.findings { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
li.finding {
  padding: 8px 10px; border-radius: 8px;
  background: var(--card); border: 1px solid var(--border); border-left: 3px solid var(--border);
}
li.finding.Problem { border-left-color: var(--problem); }
li.finding.Warning { border-left-color: var(--warning); }
li.finding.Note { border-left-color: var(--note); }
li.finding.done { opacity: .5; }
li.finding button { margin-left: 8px; padding: 3px 8px; font-size: 12px; }

.category { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--subtle); }

table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--border); }
th { font-weight: 600; color: var(--dim); position: sticky; top: 0; background: var(--bg); }
td.num { text-align: right; font-variant-numeric: tabular-nums; }

.hint { color: var(--dim); margin: 0 0 12px; }
.empty { padding: 28px 0; text-align: center; color: var(--subtle); }

/* Bars rather than a line: a scene is a discrete thing, and a line would imply
   the story passes through values between two scenes. */
.chart { display: flex; align-items: flex-end; gap: 2px; height: 160px; margin-bottom: 4px; }
.bar { flex: 1; min-width: 2px; background: var(--accent); border-radius: 2px 2px 0 0; }
.bar.unrated { background: var(--border); }
.scale { display: flex; justify-content: space-between; font-size: 11px; color: var(--subtle); }
</style>
</head>
<body>
<div id="tabs">
  <button class="tab active" data-kind="health">Project health</button>
  <button class="tab" data-kind="drift">Name drift</button>
  <button class="tab" data-kind="continuity">Continuity</button>
  <button class="tab" data-kind="concordance">Word frequency</button>
  <button class="tab" data-kind="pacing">Pacing</button>
</div>
<div id="toolbar"></div>
<div id="body"><p class="hint">Reading the manuscript...</p></div>

<script>
// The host relays a controller's reply back into the frame with nothing tying
// it to the request, so replies are routed on the kind they say they answer
// rather than on a correlation id.
function post(msg) {
  parent.postMessage({ novalistExt: JSON.stringify(msg) }, '*');
}

const bodyEl = document.getElementById('body');
const toolbarEl = document.getElementById('toolbar');
let current = 'health';

const escape = (s) => String(s ?? '').replace(/[&<>"]/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function busy(what) {
  bodyEl.innerHTML = '<p class="hint">Reading the manuscript' +
    (what ? ' for ' + escape(what) : '') + '...</p>';
}

function failed(message) {
  bodyEl.innerHTML = '<p class="empty">' + escape(message) + '</p>';
}

function findingList(findings, emptyMessage) {
  if (!findings || !findings.length) return '<p class="empty">' + escape(emptyMessage) + '</p>';
  return '<ul class="findings">' + findings.map((f) =>
    '<li class="finding ' + escape(f.severity) + '">' +
      '<div class="category">' + escape(f.category ?? f.severity) + '</div>' +
      escape(f.detail) +
    '</li>').join('') + '</ul>';
}

// ── Drawing each report ──

const draw = {
  health(p) {
    if (p.error) return failed(p.error);
    bodyEl.innerHTML = findingList(p.findings, 'Nothing to report. The project is tidy.');
  },

  drift(p) {
    if (p.error) return failed(p.error);
    if (!p.findings || !p.findings.length) {
      return failed('No spellings close to a Codex name. Nothing has drifted.');
    }
    bodyEl.innerHTML =
      '<p class="hint">Each of these is spelled almost like a name in the Codex. Some will ' +
      'be two different names that happen to be similar.</p>' +
      '<table><thead><tr><th>In the prose</th><th>Codex name</th>' +
      '<th class="num">Times</th><th>Scenes</th></tr></thead><tbody>' +
      p.findings.map((f) =>
        '<tr><td><strong>' + escape(f.found) + '</strong></td><td>' + escape(f.known) +
        '</td><td class="num">' + f.occurrences + '</td><td>' +
        escape((f.sceneTitles || []).join(', ')) + '</td></tr>').join('') +
      '</tbody></table>';
  },

  continuity(p) {
    if (p.error) return failed(p.error);

    toolbarEl.innerHTML =
      '<button id="rebase">Mark everything up to date</button>' +
      '<span class="hint" style="margin:0">' + (p.tracked ?? 0) + ' entries tracked</span>';
    document.getElementById('rebase').onclick = () => {
      busy('continuity');
      post({ kind: 'continuityRebase' });
    };

    if (p.baseline) {
      return failed('Recorded what every Codex entry looks like now. From here on, this lists ' +
        'the scenes that mention anything you change.');
    }
    if (!p.items || !p.items.length) {
      return failed('Nothing has changed since you last worked through this list.');
    }

    bodyEl.innerHTML =
      '<p class="hint">These scenes mention something you have changed since they were last ' +
      'read. Whether the change matters is your call.</p>' +
      '<ul class="findings">' + p.items.map((item) =>
        '<li class="finding ' + (item.reviewed ? 'Note done' : 'Warning') + '">' +
          '<div class="category">' + escape((item.changedEntities || []).join(', ')) + '</div>' +
          escape(item.chapterTitle + ' / ' + item.sceneTitle) +
          (item.reviewed ? '' :
            '<button data-scene="' + escape(item.sceneId) + '">Read it</button>') +
        '</li>').join('') + '</ul>';

    bodyEl.querySelectorAll('button[data-scene]').forEach((button) => {
      button.onclick = () => {
        busy('continuity');
        post({ kind: 'continuityReviewed', sceneId: button.dataset.scene });
      };
    });
  },

  concordance(p) {
    if (p.error) return failed(p.error);

    const table = (words) =>
      '<table><thead><tr><th>Word</th><th class="num">Times</th>' +
      '<th class="num">Scenes</th></tr></thead><tbody>' +
      (words || []).map((w) => '<tr><td>' + escape(w.word) + '</td><td class="num">' +
        w.count + '</td><td class="num">' + w.scenes + '</td></tr>').join('') +
      '</tbody></table>';

    bodyEl.innerHTML =
      '<p class="hint">' + (p.distinct ?? 0) + ' distinct words. The interesting ones are ' +
      'usually not at the top.</p>' +
      '<h3>Used across several scenes</h3>' +
      ((p.habits && p.habits.length)
        ? table(p.habits)
        : '<p class="empty">Nothing used often enough across enough scenes.</p>') +
      '<h3>Everything, by count</h3>' + table(p.words);
  },

  pacing(p) {
    if (p.error) return failed(p.error);
    if (!p.points || !p.points.length) return failed('No scenes to chart yet.');

    const highest = Math.max(1, ...p.points.map((s) => s.intensity ?? 0));
    bodyEl.innerHTML =
      '<div class="chart">' + p.points.map((s) => {
        const height = s.intensity == null ? 4 : Math.max(4, (s.intensity / highest) * 100);
        const title = s.chapterTitle + ' / ' + s.sceneTitle +
          (s.intensity == null ? ' (no intensity set)' : ' - intensity ' + s.intensity);
        return '<div class="bar' + (s.intensity == null ? ' unrated' : '') +
          '" style="height:' + height + '%" title="' + escape(title) + '"></div>';
      }).join('') + '</div>' +
      '<div class="scale"><span>' + escape(p.points[0].chapterTitle) + '</span><span>' +
      escape(p.points[p.points.length - 1].chapterTitle) + '</span></div>' +
      '<h3>What that suggests</h3>' +
      findingList(p.observations, 'Nothing worth pointing at.');
  }
};

window.addEventListener('message', (event) => {
  const raw = event.data && event.data.novalistHost;
  if (typeof raw !== 'string') return;

  let msg;
  try {
    msg = JSON.parse(raw);
  } catch {
    return;
  }

  // A reply for a tab the writer has since left is dropped rather than drawn
  // over whatever they are now looking at.
  if (!msg || msg.kind !== current) return;
  const render = draw[msg.kind];
  if (render) render(msg.payload || {});
});

function show(kind) {
  current = kind;
  document.querySelectorAll('.tab').forEach((t) =>
    t.classList.toggle('active', t.dataset.kind === kind));
  toolbarEl.innerHTML = '';

  if (kind === 'concordance') {
    toolbarEl.innerHTML =
      '<input type="text" id="stop" placeholder="Words to ignore, comma separated">' +
      '<button id="count">Count</button>';
    const run = () => {
      const raw = document.getElementById('stop').value.trim();
      busy('word frequency');
      post(raw.length
        ? { kind: 'concordance', stopWords: raw.split(',').map((w) => w.trim()).filter(Boolean) }
        : { kind: 'concordance' });
    };
    document.getElementById('count').onclick = run;
    run();
    return;
  }

  busy({
    health: 'problems',
    drift: 'near-miss names',
    continuity: 'continuity',
    pacing: 'the shape of the book'
  }[kind]);
  post({ kind });
}

document.querySelectorAll('.tab').forEach((tab) => {
  tab.onclick = () => show(tab.dataset.kind);
});

show('health');
</script>
</body>
</html>

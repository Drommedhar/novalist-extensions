<div id="app">
  <nav class="tabs" role="tablist">
    <button class="tab active" data-kind="health" role="tab">Project health</button>
    <button class="tab" data-kind="drift" role="tab">Name drift</button>
    <button class="tab" data-kind="continuity" role="tab">Continuity</button>
    <button class="tab" data-kind="concordance" role="tab">Word frequency</button>
    <button class="tab" data-kind="pacing" role="tab">Pacing</button>
  </nav>

  <div id="toolbar" class="toolbar"></div>
  <div id="body" class="body">
    <p class="hint">Pick a report.</p>
  </div>
</div>

<style>
  :root {
    color-scheme: light dark;
    --gap: 12px;
    --radius: 8px;
    --problem: #d64545;
    --warning: #c08a2e;
    --note: #4a7fb5;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font: 13px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--nl-text, #1c1c1e);
    background: var(--nl-surface, transparent);
  }

  #app { padding: var(--gap); display: flex; flex-direction: column; gap: var(--gap); height: 100vh; }

  .tabs { display: flex; gap: 4px; flex-wrap: wrap; }

  .tab {
    padding: 6px 12px;
    border: 1px solid var(--nl-border, #d0d0d5);
    border-radius: var(--radius);
    background: transparent;
    color: inherit;
    font: inherit;
    cursor: pointer;
  }
  .tab:hover { background: var(--nl-surface-hover, rgba(127,127,127,0.1)); }
  .tab.active { border-color: var(--nl-accent, #4a7fb5); font-weight: 600; }

  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .toolbar:empty { display: none; }

  .body { flex: 1; overflow-y: auto; }

  button.action {
    padding: 5px 10px;
    border: 1px solid var(--nl-border, #d0d0d5);
    border-radius: var(--radius);
    background: transparent;
    color: inherit;
    font: inherit;
    cursor: pointer;
  }
  button.action:hover { background: var(--nl-surface-hover, rgba(127,127,127,0.1)); }

  input[type="text"] {
    flex: 1;
    min-width: 12em;
    padding: 5px 8px;
    border: 1px solid var(--nl-border, #d0d0d5);
    border-radius: var(--radius);
    background: transparent;
    color: inherit;
    font: inherit;
  }

  ul.findings { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }

  li.finding {
    padding: 8px 10px;
    border: 1px solid var(--nl-border, #d0d0d5);
    border-left: 3px solid var(--nl-border, #d0d0d5);
    border-radius: var(--radius);
  }
  li.finding.Problem { border-left-color: var(--problem); }
  li.finding.Warning { border-left-color: var(--warning); }
  li.finding.Note    { border-left-color: var(--note); }
  li.finding.done    { opacity: 0.5; }

  .category { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; opacity: 0.65; }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--nl-border, #e4e4e8); }
  th { font-weight: 600; position: sticky; top: 0; background: var(--nl-surface, #fff); }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }

  .hint { opacity: 0.7; }
  .empty { padding: 24px 0; text-align: center; opacity: 0.7; }

  /* The pacing chart. Bars rather than a line: a scene is a discrete thing, and
     a line implies the story passes through values between two scenes. */
  .chart { display: flex; align-items: flex-end; gap: 2px; height: 160px; padding-top: 8px; }
  .bar { flex: 1; min-width: 2px; background: var(--nl-accent, #4a7fb5); border-radius: 2px 2px 0 0; }
  .bar.unrated { background: var(--nl-border, #d0d0d5); }
  .scale { display: flex; justify-content: space-between; font-size: 11px; opacity: 0.6; }
</style>

<script>
  // The host relays postMessage to the extension and delivers the reply back.
  let nextId = 1;
  const waiting = new Map();

  window.addEventListener('message', (event) => {
    let message;
    try {
      message = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
    } catch {
      return;
    }
    if (!message || message.replyTo == null) return;
    const resolve = waiting.get(message.replyTo);
    if (!resolve) return;
    waiting.delete(message.replyTo);
    resolve(message.payload ?? message);
  });

  function ask(kind, extra) {
    const id = nextId++;
    return new Promise((resolve) => {
      waiting.set(id, resolve);
      parent.postMessage(JSON.stringify({ ...(extra || {}), kind, replyTo: id }), '*');
      // A report that reads the whole book can be slow, but it cannot hang the
      // panel forever with no explanation.
      setTimeout(() => {
        if (!waiting.has(id)) return;
        waiting.delete(id);
        resolve({ error: 'That took too long. Try again.' });
      }, 120000);
    });
  }

  const body = document.getElementById('body');
  const toolbar = document.getElementById('toolbar');
  let current = 'health';

  const escape = (s) => String(s ?? '').replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

  function busy(what) {
    body.innerHTML = '<p class="hint">Reading the manuscript' + (what ? ' for ' + escape(what) : '') + '...</p>';
  }

  function failed(message) {
    body.innerHTML = '<p class="empty">' + escape(message) + '</p>';
  }

  function findingList(findings, emptyMessage) {
    if (!findings || findings.length === 0) return '<p class="empty">' + escape(emptyMessage) + '</p>';
    return '<ul class="findings">' + findings.map((f) =>
      '<li class="finding ' + escape(f.severity) + '">' +
        '<div class="category">' + escape(f.category ?? f.severity) + '</div>' +
        escape(f.detail) +
      '</li>').join('') + '</ul>';
  }

  const reports = {
    async health() {
      toolbar.innerHTML = '';
      busy('problems');
      const reply = await ask('health');
      if (reply.error) return failed(reply.error);
      body.innerHTML = findingList(reply.findings, 'Nothing to report. The project is tidy.');
    },

    async drift() {
      toolbar.innerHTML = '';
      busy('near-miss names');
      const reply = await ask('drift');
      if (reply.error) return failed(reply.error);
      if (!reply.findings.length) {
        return failed('No spellings close to a Codex name. Nothing has drifted.');
      }
      body.innerHTML =
        '<p class="hint">Each of these is spelled almost like a name in the Codex. Some will be ' +
        'two different names that happen to be similar.</p>' +
        '<table><thead><tr><th>In the prose</th><th>Codex name</th><th class="num">Times</th>' +
        '<th>Scenes</th></tr></thead><tbody>' +
        reply.findings.map((f) =>
          '<tr><td><strong>' + escape(f.found) + '</strong></td><td>' + escape(f.known) + '</td>' +
          '<td class="num">' + f.occurrences + '</td><td>' + escape(f.sceneTitles.join(', ')) + '</td></tr>'
        ).join('') + '</tbody></table>';
    },

    async continuity() {
      toolbar.innerHTML =
        '<button class="action" id="rebase">Mark everything up to date</button>' +
        '<span class="hint" id="tracked"></span>';
      document.getElementById('rebase').onclick = async () => {
        busy('continuity');
        render(await ask('continuityRebase'));
      };
      busy('continuity');
      render(await ask('continuity'));

      function render(reply) {
        if (reply.error) return failed(reply.error);
        document.getElementById('tracked').textContent = reply.tracked + ' entries tracked';

        if (reply.baseline) {
          return failed(
            'Recorded what every Codex entry looks like now. From here on, this lists the scenes ' +
            'that mention anything you change.');
        }
        if (!reply.items.length) {
          return failed('Nothing has changed since you last worked through this list.');
        }

        body.innerHTML =
          '<p class="hint">These scenes mention something you have changed since they were last ' +
          'read. Whether the change matters is your call.</p>' +
          '<ul class="findings">' + reply.items.map((item) =>
            '<li class="finding ' + (item.reviewed ? 'Note done' : 'Warning') + '">' +
              '<div class="category">' + escape(item.changedEntities.join(', ')) + '</div>' +
              escape(item.chapterTitle + ' / ' + item.sceneTitle) +
              (item.reviewed ? '' :
                ' <button class="action" data-scene="' + escape(item.sceneId) + '">Read it</button>') +
            '</li>').join('') + '</ul>';

        body.querySelectorAll('button[data-scene]').forEach((button) => {
          button.onclick = async () => {
            busy('continuity');
            render(await ask('continuityReviewed', { sceneId: button.dataset.scene }));
          };
        });
      }
    },

    async concordance() {
      toolbar.innerHTML =
        '<input type="text" id="stop" placeholder="Words to ignore, comma separated">' +
        '<button class="action" id="run">Count</button>' +
        '<button class="action" id="defaults">Use the default list</button>';

      const run = async () => {
        const raw = document.getElementById('stop').value.trim();
        busy('word frequency');
        const reply = await ask('concordance', raw.length
          ? { stopWords: raw.split(',').map((w) => w.trim()).filter(Boolean) }
          : {});
        if (reply.error) return failed(reply.error);

        body.innerHTML =
          '<p class="hint">' + reply.distinct + ' distinct words. The interesting ones are usually ' +
          'not at the top.</p>' +
          '<h3>Used across several scenes</h3>' +
          (reply.habits.length
            ? table(reply.habits)
            : '<p class="empty">Nothing used often enough across enough scenes.</p>') +
          '<h3>Everything, by count</h3>' + table(reply.words);
      };

      document.getElementById('run').onclick = run;
      document.getElementById('defaults').onclick = () => {
        document.getElementById('stop').value = '';
        run();
      };
      run();

      function table(words) {
        return '<table><thead><tr><th>Word</th><th class="num">Times</th>' +
          '<th class="num">Scenes</th></tr></thead><tbody>' +
          words.map((w) => '<tr><td>' + escape(w.word) + '</td><td class="num">' + w.count +
            '</td><td class="num">' + w.scenes + '</td></tr>').join('') + '</tbody></table>';
      }
    },

    async pacing() {
      toolbar.innerHTML = '';
      busy('the shape of the book');
      const reply = await ask('pacing');
      if (reply.error) return failed(reply.error);
      if (!reply.points.length) return failed('No scenes to chart yet.');

      const highest = Math.max(1, ...reply.points.map((p) => p.intensity ?? 0));
      body.innerHTML =
        '<div class="chart">' + reply.points.map((p) => {
          const height = p.intensity == null ? 4 : Math.max(4, (p.intensity / highest) * 100);
          const title = p.chapterTitle + ' / ' + p.sceneTitle +
            (p.intensity == null ? ' (no intensity set)' : ' - intensity ' + p.intensity);
          return '<div class="bar' + (p.intensity == null ? ' unrated' : '') +
            '" style="height:' + height + '%" title="' + escape(title) + '"></div>';
        }).join('') + '</div>' +
        '<div class="scale"><span>' + escape(reply.points[0].chapterTitle) + '</span>' +
        '<span>' + escape(reply.points[reply.points.length - 1].chapterTitle) + '</span></div>' +
        '<h3>What that suggests</h3>' +
        findingList(reply.observations, 'Nothing worth pointing at.');
    }
  };

  document.querySelectorAll('.tab').forEach((tab) => {
    tab.onclick = () => {
      document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('active', t === tab));
      current = tab.dataset.kind;
      reports[current]();
    };
  });

  reports[current]();
</script>

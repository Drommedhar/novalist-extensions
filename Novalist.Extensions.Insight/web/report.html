<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<script src="__novalist/theme.js"></script>
<title>Insight</title>
<style>
:root {
  /* Novalist hands the whole --nl-* set to a panel that asks for it (the theme
     shim above), so this panel follows the writer's theme instead of pinning
     one dark palette. The hex is the fallback for a host too old to send
     anything. */
  --bg: var(--nl-surface-editor, #1e1e1e);
  --card: var(--nl-surface-card, #252526);
  --border: var(--nl-border, #3a3a3d);
  --text: var(--nl-text, #e6edf3);
  --dim: var(--nl-text-dim, #b9bac5);
  --subtle: var(--nl-text-subtle, #8b9198);
  --accent: var(--nl-accent, #0e8bdf);
  /* The label colour on the accent. White is wrong on the gold accent the
     app's own theme uses. */
  --on-accent: var(--nl-accent-ink, #fff);
  --problem: var(--nl-danger, #e0575b);
  --warning: var(--nl-warning, #d8a13a);
  --note: var(--nl-accent, #58a0d8);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  display: flex; flex-direction: column;
  font-family: var(--nl-font-family, system-ui, -apple-system, "Segoe UI", sans-serif);
  font-size: var(--nl-font-ui, 13px);
  line-height: 1.55;
  background: var(--bg); color: var(--text);
}

#tabs { display: flex; gap: 4px; flex-wrap: wrap; padding: 10px 12px 0; }
#toolbar {
  display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 12px 0;
}
#toolbar:empty { display: none; }
#body { flex: 1; overflow-y: auto; padding: 12px; }

button {
  font: inherit; padding: 6px 12px; border-radius: 8px; cursor: pointer;
  background: var(--card); color: var(--dim); border: 1px solid var(--border);
}
button:hover { color: var(--text); border-color: var(--subtle); }
button.tab.active { color: var(--on-accent); background: var(--accent); border-color: var(--accent); }
button:disabled { opacity: .5; cursor: default; }

input[type="text"] {
  flex: 1; min-width: 12em; font: inherit; padding: 6px 8px; border-radius: 8px;
  background: var(--card); color: var(--text); border: 1px solid var(--border);
}

h3 { font-size: 13px; margin: 20px 0 8px; color: var(--dim); }

ul.findings { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
li.finding {
  padding: 8px 10px; border-radius: 8px;
  background: var(--card); border: 1px solid var(--border); border-left: 3px solid var(--border);
}
li.finding.Problem { border-left-color: var(--problem); }
li.finding.Warning { border-left-color: var(--warning); }
li.finding.Note { border-left-color: var(--note); }
li.finding.done { opacity: .5; }
li.finding button { margin-left: 8px; padding: 3px 8px; font-size: 12px; }

.category { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--subtle); }

table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--border); }
th { font-weight: 600; color: var(--dim); position: sticky; top: 0; background: var(--bg); }
td.num { text-align: right; font-variant-numeric: tabular-nums; }

.hint { color: var(--dim); margin: 0 0 12px; }
.empty { padding: 28px 0; text-align: center; color: var(--subtle); }

/* Bars rather than a line: a scene is a discrete thing, and a line would imply
   the story passes through values between two scenes. */
.chart { display: flex; align-items: flex-end; gap: 2px; height: 160px; margin-bottom: 4px; }
.bar { flex: 1; min-width: 2px; background: var(--accent); border-radius: 2px 2px 0 0; }
.bar.unrated { background: var(--border); }
.scale { display: flex; justify-content: space-between; font-size: 11px; color: var(--subtle); }
</style>
</head>
<body>
<div id="tabs">
  <button class="tab active" data-kind="health" data-t="tabHealth"></button>
  <button class="tab" data-kind="drift" data-t="tabDrift"></button>
  <button class="tab" data-kind="continuity" data-t="tabContinuity"></button>
  <button class="tab" data-kind="concordance" data-t="tabConcordance"></button>
  <button class="tab" data-kind="pacing" data-t="tabPacing"></button>
  <button class="tab" data-kind="presence" data-t="tabPresence"></button>
  <button class="tab" data-kind="statistics" data-t="tabStatistics"></button>
</div>
<div id="toolbar"></div>
<div id="body"></div>

<script>
// The host relays a controller's reply back into the frame with nothing tying
// it to the request, so replies are routed on the kind they say they answer
// rather than on a correlation id.
function post(msg) {
  parent.postMessage({ novalistExt: JSON.stringify(msg) }, '*');
}

const bodyEl = document.getElementById('body');
const toolbarEl = document.getElementById('toolbar');
let current = 'health';

// Every label comes from the host, so this page holds no English of its own and
// follows the project language.
let S = {};
const t = (key, ...args) => {
  let text = S[key] || '';
  args.forEach((a, i) => { text = text.replace('{' + i + '}', String(a)); });
  return text;
};

const escape = (s) => String(s ?? '').replace(/[&<>"]/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function busy() {
  bodyEl.innerHTML = '<p class="hint">' + escape(t('reading')) + '</p>';
}

function failed(message) {
  bodyEl.innerHTML = '<p class="empty">' + escape(message) + '</p>';
}

function findingList(findings, emptyMessage) {
  if (!findings || !findings.length) return '<p class="empty">' + escape(emptyMessage) + '</p>';
  return '<ul class="findings">' + findings.map((f) =>
    '<li class="finding ' + escape(f.severity) + '">' +
      '<div class="category">' + escape(f.category ?? f.severity) + '</div>' +
      escape(f.detail) +
    '</li>').join('') + '</ul>';
}

// ── Drawing each report ──

const draw = {
  health(p) {
    if (p.error) return failed(p.error);
    bodyEl.innerHTML = findingList(p.findings, t('healthClean'));
  },

  drift(p) {
    if (p.error) return failed(p.error);
    if (!p.findings || !p.findings.length) return failed(t('driftNone'));
    bodyEl.innerHTML =
      '<p class="hint">' + escape(t('driftHint')) + '</p>' +
      '<table><thead><tr><th>' + escape(t('driftFound')) + '</th><th>' +
      escape(t('driftKnown')) + '</th><th class="num">' + escape(t('driftTimes')) +
      '</th><th>' + escape(t('driftScenes')) + '</th></tr></thead><tbody>' +
      p.findings.map((f) =>
        '<tr><td><strong>' + escape(f.found) + '</strong></td><td>' + escape(f.known) +
        '</td><td class="num">' + f.occurrences + '</td><td>' +
        escape((f.sceneTitles || []).join(', ')) + '</td></tr>').join('') +
      '</tbody></table>';
  },

  continuity(p) {
    if (p.error) return failed(p.error);

    toolbarEl.innerHTML =
      '<button id="rebase">' + escape(t('continuityRebase')) + '</button>' +
      '<span class="hint" style="margin:0">' + escape(t('continuityTracked', p.tracked ?? 0)) +
      '</span>';
    document.getElementById('rebase').onclick = () => {
      busy();
      post({ kind: 'continuityRebase' });
    };

    if (p.baseline) return failed(t('continuityBaseline'));
    if (!p.items || !p.items.length) return failed(t('continuityClear'));

    bodyEl.innerHTML =
      '<p class="hint">' + escape(t('continuityHint')) + '</p>' +
      '<ul class="findings">' + p.items.map((item) =>
        '<li class="finding ' + (item.reviewed ? 'Note done' : 'Warning') + '">' +
          '<div class="category">' + escape((item.changedEntities || []).join(', ')) + '</div>' +
          escape(item.chapterTitle + ' / ' + item.sceneTitle) +
          (item.reviewed ? '' :
            '<button data-scene="' + escape(item.sceneId) + '">' +
              escape(t('continuityRead')) + '</button>') +
        '</li>').join('') + '</ul>';

    bodyEl.querySelectorAll('button[data-scene]').forEach((button) => {
      button.onclick = () => {
        busy();
        post({ kind: 'continuityReviewed', sceneId: button.dataset.scene });
      };
    });
  },

  concordance(p) {
    if (p.error) return failed(p.error);

    const table = (words) =>
      '<table><thead><tr><th>' + escape(t('colWord')) + '</th><th class="num">' +
      escape(t('colTimes')) + '</th><th class="num">' + escape(t('colScenes')) +
      '</th></tr></thead><tbody>' +
      (words || []).map((w) => '<tr><td>' + escape(w.word) + '</td><td class="num">' +
        w.count + '</td><td class="num">' + w.scenes + '</td></tr>').join('') +
      '</tbody></table>';

    bodyEl.innerHTML =
      '<p class="hint">' + escape(t('concordanceDistinct', p.distinct ?? 0)) + '</p>' +
      '<h3>' + escape(t('concordanceHabits')) + '</h3>' +
      ((p.habits && p.habits.length)
        ? table(p.habits)
        : '<p class="empty">' + escape(t('concordanceNoHabits')) + '</p>') +
      '<h3>' + escape(t('concordanceAll')) + '</h3>' + table(p.words);
  },

  pacing(p) {
    if (p.error) return failed(p.error);
    if (!p.points || !p.points.length) return failed(t('pacingNone'));

    const highest = Math.max(1, ...p.points.map((s) => s.intensity ?? 0));
    bodyEl.innerHTML =
      '<div class="chart">' + p.points.map((s) => {
        const height = s.intensity == null ? 4 : Math.max(4, (s.intensity / highest) * 100);
        const title = s.chapterTitle + ' / ' + s.sceneTitle + ' - ' +
          (s.intensity == null ? t('pacingUnrated') : t('pacingIntensity') + ' ' + s.intensity);
        return '<div class="bar' + (s.intensity == null ? ' unrated' : '') +
          '" style="height:' + height + '%" title="' + escape(title) + '"></div>';
      }).join('') + '</div>' +
      '<div class="scale"><span>' + escape(p.points[0].chapterTitle) + '</span><span>' +
      escape(p.points[p.points.length - 1].chapterTitle) + '</span></div>' +
      '<h3>' + escape(t('pacingSuggests')) + '</h3>' +
      findingList(p.observations, t('pacingNothing'));
  },

  /**
   * Who drops out of the book, and where.
   *
   * The Inspector says "last seen N chapters ago" for whichever scene is open,
   * at a fixed threshold. That answers "is this one overdue right now" and not
   * the question a revision asks: who vanished from act two, and for how long.
   */
  presence(p) {
    if (p.error) return failed(p.error);
    if (!p.rows || !p.rows.length) return failed(t('presenceNone'));

    const rows = p.rows.map((r) => {
      const range = r.appearances === 0
        ? '<em>' + escape(t('presenceNever')) + '</em>'
        : r.firstChapter + ' - ' + r.lastChapter;
      const gap = r.longestGap > 0 ? r.longestGap + ' (' + r.gapStartsAt + ')' : '-';
      const flag = r.disappearsEarly
        ? ' <span class="category">' + escape(t('presenceDropped')) + '</span>'
        : '';
      return '<tr><td>' + escape(r.name) + flag + '</td><td>' + r.appearances +
        '</td><td>' + range + '</td><td>' + gap + '</td></tr>';
    }).join('');

    bodyEl.innerHTML =
      '<p class="hint">' + escape(t('presenceHint')) + '</p>' +
      '<table><thead><tr>' +
      '<th>' + escape(t('presenceName')) + '</th>' +
      '<th>' + escape(t('presenceAppearances')) + '</th>' +
      '<th>' + escape(t('presenceRange')) + '</th>' +
      '<th>' + escape(t('presenceGap')) + '</th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table>';
  },

  statistics(p) {
    if (p.error) return failed(p.error);
    const r = p.row || {};
    const n = (v) => (v || 0).toLocaleString();
    const line = (label, value) =>
      '<tr><td>' + escape(label) + '</td><td class="num">' + value + '</td></tr>';

    bodyEl.innerHTML =
      '<table><tbody>' +
      line(t('statsChapters'), n(r.chapters)) +
      line(t('statsScenes'), n(r.scenes)) +
      line(t('statsWords'), n(r.words)) +
      line(t('statsCharacters'), n(r.characters)) +
      line(t('statsCharactersNoSpaces'), n(r.charactersNoSpaces)) +
      // Both bases, not one: words per page is what a writer means by a
      // paperback page, and characters per page is closer for a language where
      // a word count says less about set length.
      line(t('statsBasisWords') + ' (' + n(p.wordsPerPage) + ' ' + t('statsPerPage') + ')',
        n(p.pagesByWords)) +
      line(t('statsBasisCharacters') + ' (' + n(p.charactersPerPage) + ' ' + t('statsPerPage') + ')',
        n(p.pagesByCharacters)) +
      '</tbody></table>' +
      '<p class="hint">' + escape(t('statsEstimate')) + '</p>';
  }
};

window.addEventListener('message', (event) => {
  const raw = event.data && event.data.novalistHost;
  if (typeof raw !== 'string') return;

  let msg;
  try {
    msg = JSON.parse(raw);
  } catch {
    return;
  }

  // A reply for a tab the writer has since left is dropped rather than drawn
  // over whatever they are now looking at.
  if (!msg) return;

  // The labels arrive once, before anything is drawn.
  if (msg.kind === 'strings') {
    S = (msg.payload && msg.payload.strings) || {};
    document.querySelectorAll('[data-t]').forEach((el) => {
      el.textContent = t(el.dataset.t);
    });
    show('health');
    return;
  }

  // A reply for a tab the writer has since left is dropped rather than drawn
  // over whatever they are now looking at.
  if (msg.kind !== current) return;
  const render = draw[msg.kind];
  if (render) render(msg.payload || {});
});

function show(kind) {
  current = kind;
  document.querySelectorAll('.tab').forEach((t) =>
    t.classList.toggle('active', t.dataset.kind === kind));
  toolbarEl.innerHTML = '';

  if (kind === 'statistics') {
    toolbarEl.innerHTML =
      '<label>' + escape(t('statsBasisWords')) +
      ' <input type="number" id="wpp" min="1" max="2000" value="350"></label>' +
      '<label>' + escape(t('statsBasisCharacters')) +
      ' <input type="number" id="cpp" min="1" max="20000" value="1800"></label>' +
      '<label><input type="checkbox" id="inactive"> ' +
      escape(t('statsIncludeInactive')) + '</label>';
    const run = () => {
      busy();
      post({
        kind: 'statistics',
        wordsPerPage: Number(document.getElementById('wpp').value) || 350,
        charactersPerPage: Number(document.getElementById('cpp').value) || 1800,
        includeInactive: document.getElementById('inactive').checked
      });
    };
    document.getElementById('wpp').onchange = run;
    document.getElementById('cpp').onchange = run;
    document.getElementById('inactive').onchange = run;
    run();
    return;
  }

  if (kind === 'concordance') {
    toolbarEl.innerHTML =
      '<input type="text" id="stop" placeholder="' + escape(t('concordanceStop')) + '">' +
      '<button id="count">' + escape(t('concordanceCount')) + '</button>';
    const run = () => {
      const raw = document.getElementById('stop').value.trim();
      busy();
      post(raw.length
        ? { kind: 'concordance', stopWords: raw.split(',').map((w) => w.trim()).filter(Boolean) }
        : { kind: 'concordance' });
    };
    document.getElementById('count').onclick = run;
    run();
    return;
  }

  busy();
  post({ kind });
}

document.querySelectorAll('.tab').forEach((tab) => {
  tab.onclick = () => show(tab.dataset.kind);
});

// Labels first: everything else waits on them, because a panel that renders in
// English and then swaps to German is worse than one that waits a beat.
post({ kind: 'strings' });
</script>
</body>
</html>
